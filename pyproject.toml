[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nimblend"
dynamic = ["version"]
description = "Labeled sparse N-dimensional arrays"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Carlos Gaete-Morales", email = "cdgaete@gmail.com" }]
requires-python = ">=3.13,<3.15"
dependencies = ["numpy>=2.5.2"]
keywords = [
    "sparse",
    "labeled arrays",
    "ndarray",
    "numpy",
    "alignment",
    "broadcasting",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/cdgaete/nimblend"
Documentation = "https://cdgaete.github.io/nimopt/nimblend/"
Repository = "https://github.com/cdgaete/nimblend"
Issues = "https://github.com/cdgaete/nimblend/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.16",
    "scipy>=1.16",
    "pre-commit>=4.6.2",
    "coverage>=7.16",
    "vulture>=2.14",
    "ty>=0.0.78",
]

[tool.hatch.version]
path = "src/nimblend/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nimblend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = [".", "src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "S", "SIM114", "C416", "PIE790", "B023", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]
"benchmarks/**" = ["S101", "ANN"]

[tool.ty.src]
include = ["src"]

[tool.coverage.run]
branch = true
source = ["src/nimblend"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.vulture]
min_confidence = 60
paths = ["src", "tests", "benchmarks"]
sort_by_size = true
ignore_names = ["args", "kwargs"]
